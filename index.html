    --brass:#9C6B2E;
    --brass-soft:#C79A54;
    --brass-tint:#EADDC2;
    --moss:#3E4F3F;
    --moss-tint:#DCE3D6;
    --clay:#8B3F35;
    --clay-tint:#EFDAD4;
    --line:rgba(30,27,34,0.13);
    --shadow:rgba(30,27,34,0.18);
    color-scheme: light;

  @media (prefers-color-scheme: dark){

      --paper-raised:#1E1F26;
      --ink:#ECE7DA;
      --ink-soft:#A9A192;
      --ink-faint:#736C5E;
      --brass:#D3A054;
      --brass-soft:#8C6A34;
      --brass-tint:#3A311E;
      --moss:#8AAA88;
      --moss-tint:#22291F;
      --clay:#CD8574;
      --clay-tint:#2E211D;
      --line:rgba(236,231,218,0.14);
      --shadow:rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15151A;
    --paper-raised:#1E1F26;
    --ink:#ECE7DA;
    --ink-soft:#A9A192;
    --ink-faint:#736C5E;
    --brass:#D3A054;
    --brass-soft:#8C6A34;
    --brass-tint:#3A311E;
    --moss:#8AAA88;
    --moss-tint:#22291F;
    --clay:#CD8574;
    --clay-tint:#2E211D;
    --line:rgba(236,231,218,0.14);
    --shadow:rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Libre Franklin", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:"Fraunces", Georgia, serif;}
  h1,h2,h3{text-wrap:balance; margin:0;}
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- shell ---------- */
  .shell{max-width:1180px; margin:0 auto; padding:0 24px;}
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding-block:11px;
    gap:16px; flex-wrap:wrap;
  }
  .wordmark{
    font-family:"Fraunces", serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    letter-spacing:.01em;
    display:flex; align-items:baseline; gap:8px;
  }
  .wordmark .dot{
    font-style:normal;
    color:var(--brass);
  }
  .navpills{display:flex; gap:6px; background:var(--paper-raised); padding:3px; border-radius:999px; border:1px solid var(--line);}
  .navpill{
    border:none; background:transparent; color:var(--ink-soft);
    padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;
    cursor:pointer; transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .navpill[aria-current="true"]{background:var(--brass); color:#241906;}
  .navpill:not([aria-current="true"]):hover{color:var(--ink); background:var(--line);}

  main{padding-block:14px 40px;}
  .screen{animation:rise .3s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){ .screen{animation:none;} }

  /* ---------- home ---------- */
  .hero{
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px;
    flex-wrap:wrap; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .hero-kicker{color:var(--moss); font-weight:700; margin-bottom:3px; display:block;}
  .hero h1{font-size:clamp(17px,2.1vw,21px); font-weight:500; max-width:620px; line-height:1.28;}
  .hero-stats{display:flex; gap:20px;}
  .stat{text-align:right;}
  .stat b{display:block; font-family:"Fraunces",serif; font-size:19px; font-weight:600; line-height:1.1;}
  .stat span{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);}

  .shelves{display:grid; grid-template-columns:1fr; gap:2px 24px;}
  @media (min-width:700px){ .shelves{grid-template-columns:1fr 1fr;} }
  @media (min-width:1100px){ .shelves{grid-template-columns:1fr 1fr 1fr;} }
  .shelf{margin-bottom:14px; min-width:0;}
  .shelf-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
    border-bottom:1px solid var(--line); padding-bottom:6px;
  }
  .shelf-head .eyebrow{color:var(--moss); font-weight:600;}
  .shelf-head .count{color:var(--ink-faint); font-size:11.5px; font-family:"IBM Plex Mono",monospace;}
  .shelf-row{
    display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin;
  }

  .card{
    flex:0 0 auto; width:104px; cursor:pointer; border:none; background:none; padding:0; text-align:left;
    color:inherit; display:flex; flex-direction:column; gap:6px;
  }
  .card:focus-visible{outline:2px solid var(--brass); outline-offset:3px; border-radius:4px;}
  .cover{
    width:104px; height:150px; border-radius:7px; position:relative; overflow:hidden;
    box-shadow:0 4px 10px -4px var(--shadow); background:var(--paper-raised);
    transition:transform .16s ease;
  }
  .cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .card:hover .cover{transform:translateY(-2px);}
  .pill{
    position:absolute; top:6px; right:6px; z-index:1;
    font-family:"IBM Plex Mono",monospace; font-size:8.5px; letter-spacing:.05em; text-transform:uppercase;
    background:rgba(18,16,12,.62); color:#F6F1E6; padding:3px 6px; border-radius:999px;
    backdrop-filter:blur(2px);
  }
  .card .meta{font-size:11px; color:var(--ink-soft); line-height:1.25;}
  .card .meta b{color:var(--ink); font-weight:600; display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .progress-track{height:3px; border-radius:2px; background:var(--line); overflow:hidden; margin-top:3px;}
  .progress-fill{height:100%; background:var(--brass);}

  /* ---------- book detail ---------- */
  .book-layout{display:grid; grid-template-columns:184px 1fr; gap:28px; align-items:start;}
  @media (max-width:680px){ .book-layout{grid-template-columns:1fr;} }
  .book-cover-big{width:100%; max-width:184px; aspect-ratio:2/3; border-radius:10px; box-shadow:0 12px 24px -12px var(--shadow); overflow:hidden; background:var(--paper-raised);}
  .book-cover-big img{width:100%; height:100%; object-fit:cover; display:block;}
  .book-side-facts{margin-top:12px; display:flex; flex-direction:column; gap:7px;}
  .fact{display:flex; justify-content:space-between; font-size:12px; gap:12px; border-bottom:1px dashed var(--line); padding-bottom:6px;}
  .fact span:first-child{color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;}
  .fact span:last-child{font-weight:600; text-align:right;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink-soft);
    font-size:12.5px; cursor:pointer; padding:0; margin-bottom:14px; font-weight:600;
  }
  .back-link:hover{color:var(--ink);}

  .book-title{font-size:clamp(21px,2.8vw,28px); font-weight:500;}
  .book-author{color:var(--ink-soft); font-size:14px; margin-top:3px;}
  .avg-rating{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12.5px; color:var(--ink-soft);}
  .avg-rating .stars{color:var(--brass); letter-spacing:1px;}
  .desc{margin-top:12px; font-size:13.5px; line-height:1.55; color:var(--ink-soft); max-width:62ch;}

  .personal-card{
    margin-top:18px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  }
  .personal-card > .eyebrow{color:var(--clay); font-weight:600; margin-bottom:3px;}
  .personal-card h3{font-size:16px; font-weight:500; margin-bottom:12px;}

  .status-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .status-chip{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  .status-chip[aria-pressed="true"]{background:var(--moss); border-color:var(--moss); color:var(--moss-tint);}
  .status-chip:not([aria-pressed="true"]):hover{border-color:var(--ink-faint); color:var(--ink);}

  .row-split{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:520px){.row-split{grid-template-columns:1fr;}}

  .star-rate button{background:none; border:none; cursor:pointer; font-size:19px; color:var(--line); padding:0; line-height:1;}
  .star-rate button.on{color:var(--brass);}

  .review-box{margin-top:14px;}
  .review-text{font-size:13.5px; line-height:1.5; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:11px 13px;}
  .review-actions{margin-top:8px; display:flex; gap:10px;}
  textarea.review-edit{
    width:100%; min-height:72px; font-family:inherit; font-size:13.5px; line-height:1.5; padding:11px 13px;
    border-radius:9px; border:1px solid var(--brass); background:var(--paper); color:var(--ink); resize:vertical;
  }

  .btn{
    border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid transparent;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-brass{background:var(--brass); color:#241906;}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .btn[disabled]{opacity:.55; cursor:default;}

  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tag{font-size:11px; font-weight:600; padding:5px 9px; border-radius:6px; background:var(--brass-tint); color:var(--brass);}

  /* ---------- recommendations ---------- */
  .rec-wrap{max-width:660px; margin:0 auto;}
  .rec-loading{text-align:center; padding:46px 20px; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .lamp{width:12px; height:12px; border-radius:50%; background:var(--brass); animation:breathe 1.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.35; transform:scale(.85);} 50%{opacity:1; transform:scale(1.05);}}
  @media (prefers-reduced-motion:reduce){.lamp{animation:none; opacity:.9;}}
  .rec-loading p{font-family:"Fraunces",serif; font-style:italic; font-size:17px; color:var(--ink-soft);}

  .rec-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:16px;
    padding:22px clamp(16px,4vw,30px); position:relative;
  }
  .rec-byline{display:flex; align-items:center; gap:9px; margin-bottom:12px;}
  .rec-byline .dot{width:7px; height:7px; border-radius:50%; background:var(--clay);}
  .rec-note{font-family:"Fraunces",serif; font-size:clamp(15.5px,2.1vw,18px); line-height:1.42; font-weight:400;}
  .rec-note b{font-weight:600;}
  .rec-pick{
    margin-top:16px; display:flex; gap:16px; padding-top:16px; border-top:1px solid var(--line);
    align-items:flex-start; flex-wrap:wrap;
  }
  .rec-pick .cover{width:80px; height:116px; flex:0 0 auto;}
  .rec-pick-meta{flex:1; min-width:180px;}
  .rec-pick-meta .eyebrow{color:var(--clay); font-weight:600;}
  .rec-pick-meta h2{font-size:19px; font-weight:500; margin-top:3px;}
  .rec-pick-meta .book-author{margin-top:1px; font-size:13px;}

  .why-list{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .why-list li{display:flex; gap:8px; font-size:13px; line-height:1.42; color:var(--ink-soft);}
  .why-list .check{color:var(--moss); font-weight:700; flex:0 0 auto;}
  .rec-more{margin-top:12px; font-size:13px; line-height:1.5; color:var(--ink-soft); border-left:2px solid var(--brass-soft); padding-left:12px;}

  .rec-actions{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .rec-secondaries{margin-top:24px;}
  .rec-secondaries .shelf-head{border-bottom:1px solid var(--line);}
  .sec-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){.sec-grid{grid-template-columns:1fr;}}
  .sec-card{display:flex; gap:11px; background:var(--paper-raised); border:1px solid var(--line); border-radius:11px; padding:11px;}
  .sec-card .cover{width:50px; height:73px; flex:0 0 auto;}
  .sec-card .sc-meta b{display:block; font-family:"Fraunces",serif; font-size:14px; font-weight:600;}
  .sec-card .sc-meta .a{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .sec-card .sc-meta p{font-size:11.5px; color:var(--ink-soft); margin-top:5px; line-height:1.4;}

  .dismiss-note{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-family:"Fraunces",serif; font-style:italic; font-size:16px;
  }

  @media (max-width:600px){
    .hero-stats{display:none;}
  }
</style>

  function byId(id){ for(var i=0;i<BOOKS.length;i++){ if(BOOKS[i].id===id) return BOOKS[i]; } return null; }
  function group(status){ return BOOKS.filter(function(b){ return b.status===status; }); }

  var state = {
    screen:"home",
    selectedId:"words-of-radiance",
    rec:{ phase:"idle", added:false, dismissed:false, cycled:false, tellMore:false, note:null },
    editingReview:false,
    draft:""
  };

  var NAV = [
    {id:"home", label:"Library"},
    {id:"book", label:"Book"},
    {id:"rec", label:"For You"}
  ];

  function renderNav(){
    var html = NAV.map(function(n){
      return '<button class="navpill" data-nav="'+n.id+'" aria-current="'+(state.screen===n.id)+'">'+n.label+'</button>';
    }).join("");
    document.getElementById("navpills").innerHTML = html;
  }

  function coverImg(src,title,author){
    return '<img src="'+src+'" alt="Cover of '+title+' by '+author+'" loading="lazy">';
  }
  function starString(n){
    var full = Math.floor(n), out="";
    for(var i=0;i<5;i++){ out += i<full ? "★" : "☆"; }
    return out;
  }
  function statusLabel(s){
    return {reading:"Reading", tbr:"Want to read", finished:"Finished", owned:"Owned",
      wishlist:"Want to buy", borrowed:"Borrowed", recommended:"Recommended"}[s] || s;
  }

  function bookCard(b){
    var pillHtml = b.status==="reading" ? '<div class="pill">'+b.progress+'% read</div>' : '<div class="pill">'+statusLabel(b.status)+'</div>';
    var progressHtml = b.status==="reading" || b.status==="borrowed"
      ? '<div class="progress-track"><div class="progress-fill" style="width:'+b.progress+'%"></div></div>' : '';
    return (
      '<button class="card" data-open="'+b.id+'">'+
        '<div class="cover">'+ pillHtml + coverImg(b.cover,b.title,b.author) +'</div>'+
        '<div class="meta"><b>'+b.title+'</b>'+b.author+progressHtml+'</div>'+
      '</button>'
    );
  }

  function shelf(labelText, count, booksArr){
    if(!booksArr.length) return "";
    return (
      '<section class="shelf">'+
        '<div class="shelf-head"><span class="eyebrow">'+labelText+'</span><span class="count">'+count+'</span></div>'+
        '<div class="shelf-row">'+ booksArr.map(bookCard).join("") +'</div>'+
      '</section>'
    );
  }

  function renderHome(){
    var total = BOOKS.length;
    var finishedCount = group("finished").length;
    return (
      '<div class="screen">'+
        '<div class="hero">'+
          '<div>'+
            '<span class="eyebrow hero-kicker">Your Library</span>'+
            '<h1>Every book you own, borrow, want, or are reading — organized around you, not scattered across apps.</h1>'+
          '</div>'+
          '<div class="hero-stats">'+
            '<div class="stat"><b>'+total+'</b><span>In library</span></div>'+
            '<div class="stat"><b>'+finishedCount+'</b><span>Finished ’25</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="shelves">'+
          shelf("Currently reading", group("reading").length, group("reading"))+
          shelf("Up next", group("tbr").length, group("tbr"))+
          shelf("Recently finished", group("finished").length, group("finished"))+
          shelf("Borrowed", group("borrowed").length, group("borrowed"))+
          shelf("Owned", group("owned").length, group("owned"))+
          shelf("Want to buy", group("wishlist").length, group("wishlist"))+
        '</div>'+
      '</div>'
    );
  }

  function renderBook(){
    var b = byId(state.selectedId) || byId("words-of-radiance");
    var statuses = ["reading","tbr","owned","borrowed","wishlist","finished"];
    var chips = statuses.map(function(s){
      return '<button class="status-chip" data-set-status="'+s+'" aria-pressed="'+(b.status===s)+'">'+statusLabel(s)+'</button>';
    }).join("");

    var stars = "";
    for(var i=1;i<=5;i++){ stars += '<button class="'+(i<=b.myRating?"on":"")+'" data-rate="'+i+'">★</button>'; }

    var reviewBlock;
    if(state.editingReview){
      reviewBlock = (
        '<textarea class="review-edit" id="review-input">'+state.draft+'</textarea>'+
        '<div class="review-actions">'+
          '<button class="btn btn-brass" data-save-review="1">Save review</button>'+
          '<button class="btn btn-ghost" data-cancel-review="1">Cancel</button>'+
        '</div>'
      );
    } else {
      reviewBlock = (
        '<div class="review-text">'+(b.myReview || "You haven’t written a review yet — jot down what stuck with you while it’s fresh.")+'</div>'+
        '<div class="review-actions"><button class="btn btn-ghost" data-edit-review="1">'+(b.myReview?"Edit review":"Write a review")+'</button></div>'
      );
    }

    return (
      '<div class="screen">'+
        '<button class="back-link" data-nav="home">&larr; Back to library</button>'+
        '<div class="book-layout">'+
          '<div>'+
            '<div class="book-cover-big">'+coverImg(b.cover,b.title,b.author)+'</div>'+
            '<div class="book-side-facts">'+
              (b.series?'<div class="fact"><span>Series</span><span>'+b.series+'</span></div>':'')+
              '<div class="fact"><span>Genre</span><span>'+b.genre+'</span></div>'+
              '<div class="fact"><span>Pages</span><span>'+b.pages+'</span></div>'+
              '<div class="fact"><span>Format</span><span>'+b.format+'</span></div>'+
              (b.addedNote?'<div class="fact"><span>In library</span><span>'+b.addedNote+'</span></div>':'')+
            '</div>'+
          '</div>'+
          '<div>'+
            '<div class="book-title serif">'+b.title+'</div>'+
            '<div class="book-author">by '+b.author+'</div>'+
            '<div class="avg-rating"><span class="stars">'+starString(b.avgRating)+'</span> '+b.avgRating+' average, all readers</div>'+
            '<p class="desc">'+b.description+'</p>'+

            '<div class="personal-card">'+
              '<span class="eyebrow">Your copy</span>'+
              '<h3>How this book lives in your library</h3>'+
              '<span class="field-label">Status</span>'+
              '<div class="status-row">'+chips+'</div>'+
              '<div class="row-split">'+
                '<div><span class="field-label">Your rating</span><div class="star-rate">'+stars+'</div></div>'+
                '<div><span class="field-label">Add to a list</span><div class="tags"><span class="tag">+ New list</span><span class="tag">Favorites</span><span class="tag">Book club</span></div></div>'+
              '</div>'+
              '<div class="review-box"><span class="field-label">Your review</span>'+reviewBlock+'</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'
    );
  }

  function recCoverSmall(src,title,author){
    return '<div class="cover">'+coverImg(src,title,author)+'</div>';
  }

  function renderRec(){
    var r = state.rec;
    if(r.phase==="idle"){
      r.phase = "loading";
      setTimeout(function(){ r.phase="revealed"; renderApp(); }, 1200);
    }

    if(r.phase==="loading"){
      return (
        '<div class="screen rec-wrap">'+
          '<div class="rec-loading"><div class="lamp"></div><p>Finding something you’ll love&hellip;</p></div>'+
        '</div>'
      );
    }

    if(r.dismissed && !r.note){
      return (
        '<div class="screen rec-wrap">'+
          '<div class="dismiss-note">Got it — steering away from that one. Refining your next pick&hellip;</div>'+
        '</div>'
      );
    }

    var pick = r.note || byId("the-will-of-the-many");

    var whyItems = r.note ? [
      "Different pace and voice than the last pick, on purpose",
      "Still plot-driven, still yours — pulled from the same taste pattern",
      "A quieter mystery instead of another power-system epic"
    ] : [
      "You said Mistborn’s pacing never let up, and that its magic system kept revealing new layers — this has both.",
      "You rated Red Rising 5 stars for its constant scheming and stakes; this has the same relentless plotting.",
      "A structured, learnable power hierarchy to slowly decode — exactly the kind of system you keep gravitating to.",
      "Fits a pattern across your last few favorites: plot-driven fantasy with a big structural idea underneath."
    ];

    var noteHtml = r.note ? (
      '<div class="rec-byline"><span class="dot"></span><span class="eyebrow">Reworked, based on your feedback</span></div>'+
      '<p class="rec-note">Fair enough — here’s a different angle: <b>'+r.note.title+'</b> by '+r.note.author+'.</p>'
    ) : (
      '<div class="rec-byline"><span class="dot"></span><span class="eyebrow">Your next read, picked for you</span></div>'+
      '<p class="rec-note">You mentioned in your review of <b>Mistborn</b> that you loved its fast pacing and how the magic system gradually came together. You also rated <b>Red Rising</b> highly, and most of your recent favorites have been plot-driven fantasy.</p>'
    );

    var moreHtml = r.tellMore ? (
      '<div class="rec-more">It also shares Mistborn’s trick of teaching you the rules of its power system alongside the protagonist — by the midpoint you’re solving the same puzzles he is. Readers who rated Red Rising 5 stars for its academy politics tend to rate this one just as high.</div>'
    ) : "";

    return (
      '<div class="screen rec-wrap">'+
        '<div class="rec-card">'+
          noteHtml+
          '<div class="rec-pick">'+
            recCoverSmall(pick.cover, pick.title, pick.author)+
            '<div class="rec-pick-meta">'+
              '<span class="eyebrow">Recommended</span>'+
              '<h2 class="serif">'+pick.title+'</h2>'+
              '<div class="book-author">by '+pick.author+'</div>'+
              '<p class="desc" style="margin-top:6px; font-size:13px;">'+pick.description+'</p>'+
            '</div>'+
          '</div>'+
          '<span class="field-label" style="margin-top:14px; display:block;">Why I picked this for you</span>'+
          '<ul class="why-list">'+ whyItems.map(function(w){ return '<li><span class="check">&check;</span>'+w+'</li>'; }).join("") +'</ul>'+
          moreHtml+
          '<div class="rec-actions">'+
            '<button class="btn btn-brass" data-rec-add="1" '+(r.added?"disabled":"")+'>'+(r.added?"Added to TBR ✓":"Add to TBR")+'</button>'+
            '<button class="btn btn-ghost" data-rec-more="1">'+(r.tellMore?"Show less":"Tell me more")+'</button>'+
            '<button class="btn btn-ghost" data-rec-skip="1" '+(r.cycled?"disabled":"")+'>Not for me</button>'+
          '</div>'+
        '</div>'+
        '<div class="rec-secondaries">'+
          '<div class="shelf-head"><span class="eyebrow" style="color:var(--ink-faint);">Also worth a look</span></div>'+
          '<div class="sec-grid">'+
            SECONDARY_RECS.map(function(s){
              return '<div class="sec-card">'+recCoverSmall(s.cover,s.title,s.author)+
                '<div class="sc-meta"><b>'+s.title+'</b><div class="a">'+s.author+'</div><p>'+s.why+'</p></div></div>';
            }).join("")+
          '</div>'+
        '</div>'+
      '</div>'
    );
  }

  function renderApp(){
    renderNav();
    var app = document.getElementById("app");
    if(state.screen==="home") app.innerHTML = renderHome();
    else if(state.screen==="book") app.innerHTML = renderBook();
    else app.innerHTML = renderRec();
    if(state.editingReview){
      var ta = document.getElementById("review-input");
      if(ta){ ta.focus(); ta.selectionStart = ta.value.length; }
    }
  }

  document.addEventListener("click", function(e){
    var nav = e.target.closest("[data-nav]");
    if(nav){ state.screen = nav.getAttribute("data-nav"); state.editingReview=false; renderApp(); return; }

    var open = e.target.closest("[data-open]");
    if(open){ state.selectedId = open.getAttribute("data-open"); state.screen="book"; state.editingReview=false; renderApp(); return; }

    var setStatus = e.target.closest("[data-set-status]");
    if(setStatus){ byId(state.selectedId).status = setStatus.getAttribute("data-set-status"); renderApp(); return; }

    var rate = e.target.closest("[data-rate]");
    if(rate){ byId(state.selectedId).myRating = parseInt(rate.getAttribute("data-rate"),10); renderApp(); return; }

    if(e.target.closest("[data-edit-review]")){
      var b = byId(state.selectedId);
      state.draft = b.myReview; state.editingReview = true; renderApp(); return;
    }
    if(e.target.closest("[data-cancel-review]")){ state.editingReview=false; renderApp(); return; }
    if(e.target.closest("[data-save-review]")){
      var ta = document.getElementById("review-input");
      byId(state.selectedId).myReview = ta ? ta.value : state.draft;
      state.editingReview=false; renderApp(); return;
    }

    if(e.target.closest("[data-rec-add]")){ state.rec.added = true; renderApp(); return; }
    if(e.target.closest("[data-rec-more]")){ state.rec.tellMore = !state.rec.tellMore; renderApp(); return; }
    if(e.target.closest("[data-rec-skip]")){
      state.rec.dismissed = true; renderApp();
      setTimeout(function(){
        state.rec.cycled = true;
        state.rec.note = SECONDARY_RECS[0];
        state.rec.added = false; state.rec.tellMore = false;
        renderApp();
      }, 1000);
      return;
    }
  });

  renderApp();
})();
</script>
